<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f9fafb; /* Gris très clair comme sur l'image */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Student Portal</h1>
            <p class="text-gray-500 mt-1">Please enter your information below</p>
        </div>

        <form action="#" method="POST" class="space-y-6">
            
            <div>
                <label for="full-name" class="block text-sm font-semibold text-gray-900 mb-2">
                    Full Name
                </label>
                <input type="text" id="full-name" name="full-name" 
                    placeholder="Enter your full name"
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition duration-200">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">
                    Email Address
                </label>
                <input type="email" id="email" name="email" 
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition duration-200">
            </div>

            <div>
                <label for="matricule" class="block text-sm font-semibold text-gray-900 mb-2">
                    Matricule
                </label>
                <input type="text" id="matricule" name="matricule" 
                    placeholder="Enter your matricule"
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition duration-200">
            </div>

            <button type="submit" 
                class="w-full bg-black text-white font-semibold py-3 rounded-lg hover:bg-gray-800 transition duration-300">
                Submit
            </button>

        </form>
    </div>

</body>
</html>
